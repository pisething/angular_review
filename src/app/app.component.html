<app-header></app-header>

<main>
  <ul id="users">
    @for(user of users; track user.id){
      <li>
        <app-user
          [isSelected]="user.id === selectedUserId"
          [user]="user"
          (select)="onSelected($event)"
        />
      </li>
    }
  </ul>
  @if (selectedUser){
    <app-task [userId]="selectedUser.id" [name]="selectedUser.name"></app-task>
  } @else {
    <h2>Select a user to see a task</h2>
  }
  
</main>
